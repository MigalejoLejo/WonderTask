version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: wondertask-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - wondertask-dev-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  wondertask-dev-data: